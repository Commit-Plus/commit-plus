name: AI PR Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never checkout the PR head: this job has access to provider secrets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.AI_REVIEW_OPENROUTER_MODEL }}
          GROQ_MODEL: ${{ vars.AI_REVIEW_GROQ_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.AI_REVIEW_DEEPSEEK_MODEL }}
        run: python3 scripts/ai-review/review.py
