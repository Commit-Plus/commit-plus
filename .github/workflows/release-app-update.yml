name: Release App Update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-app-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TelemetryDeck configuration
        run: python3 scripts/release/write-telemetry-config.py
        env:
          TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}

      - name: Resolve package dependencies into a stable checkout path
        run: |
          xcodebuild -resolvePackageDependencies \
            -project macgit.xcodeproj \
            -scheme macgit \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Validate tag and versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PROJECT_VERSION=$(xcodebuild -project macgit.xcodeproj -scheme macgit -showBuildSettings | awk '/MARKETING_VERSION/ { print $3; exit }')
          test "$TAG_VERSION" = "$PROJECT_VERSION"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate GoogleService-Info.plist
        run: |
          cat > macgit/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>${{ vars.FIREBASE_API_KEY }}</string>
            <key>BUNDLE_ID</key>
            <string>dev.thanhtran.macgit</string>
            <key>CLIENT_ID</key>
            <string>${{ vars.FIREBASE_CLIENT_ID }}</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ vars.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ vars.FIREBASE_GCM_SENDER_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>PROJECT_ID</key>
            <string>${{ vars.FIREBASE_PROJECT_ID }}</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>${{ vars.FIREBASE_REVERSED_CLIENT_ID }}</string>
            <key>STORAGE_BUCKET</key>
            <string>${{ vars.FIREBASE_STORAGE_BUCKET }}</string>
          </dict>
          </plist>
          PLIST

      - name: Import signing assets
        run: scripts/release/import-signing-assets.sh
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}

      # - name: Run tests
      #   run: xcodebuild -project macgit.xcodeproj -scheme macgit -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO

      - name: Build release archive
        run: scripts/release/build-release-archive.sh "$TAG_VERSION" "$BUILD_VERSION"
        env:
          COMMIT_PLUS_WEB_BASE_URL: ${{ vars.COMMIT_PLUS_WEB_BASE_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

      - name: Notarize and staple
        run: scripts/release/notarize-and-staple.sh "$ZIP_PATH" "$APP_PATH"
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}

      - name: Verify release metadata
        run: scripts/release/verify-release-metadata.sh "$APP_PATH" "$TAG_VERSION" "$BUILD_VERSION" "${{ vars.SPARKLE_FEED_URL }}" "${{ vars.COMMIT_PLUS_WEB_BASE_URL }}"

      - name: Create DMG
        run: scripts/release/create-dmg.sh "$APP_PATH" "$TAG_VERSION"

      - name: Notarize and staple DMG
        run: scripts/release/notarize-dmg.sh "$DMG_PATH"
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}

      - name: Verify DMG
        run: scripts/release/verify-dmg.sh "$DMG_PATH"

      - name: Create stable GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_PATH" "$DMG_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" "$DMG_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=false \
            --latest \
            --verify-tag

          RELEASE_IS_STABLE=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)')
          if [[ "$RELEASE_IS_STABLE" != "true" ]]; then
            echo "Release $GITHUB_REF_NAME was not published as a stable release" >&2
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json url,isDraft,isPrerelease,tagName
            exit 1
          fi
          ZIP_RELEASE_ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          DMG_RELEASE_ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG_NAME}"
          echo "release_asset_url=$ZIP_RELEASE_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "zip_release_asset_url=$ZIP_RELEASE_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "dmg_release_asset_url=$DMG_RELEASE_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "ZIP_RELEASE_ASSET_URL=$ZIP_RELEASE_ASSET_URL" >> "$GITHUB_ENV"
          echo "DMG_RELEASE_ASSET_URL=$DMG_RELEASE_ASSET_URL" >> "$GITHUB_ENV"

      - name: Verify public release assets
        run: |
          for asset_url in "$ZIP_RELEASE_ASSET_URL" "$DMG_RELEASE_ASSET_URL"; do
            reachable=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location "$asset_url" --output /dev/null; then
                reachable=true
                break
              fi
              sleep 5
            done
            if [[ "$reachable" != "true" ]]; then
              echo "Release asset did not become reachable in time: $asset_url" >&2
              exit 1
            fi
          done

      - name: Generate appcast
        run: scripts/release/generate-appcast.sh "$GITHUB_REF_NAME" "$ZIP_NAME" "$ZIP_PATH" "$RUNNER_TEMP/appcast.xml"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/pages/appcast.xml"
          cat <<'EOF' > "$RUNNER_TEMP/pages/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Commit+ App Updates</title>
          </head>
          <body>
            <p>This site hosts the stable Sparkle appcast for Commit+.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Clean up signing materials
        if: always()
        run: |
          if [[ -n "${APPSTORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "$APPSTORE_CONNECT_API_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          rm -f "$RUNNER_TEMP/CommitPlus_DeveloperID.provisionprofile"
          rm -f "$RUNNER_TEMP/CommitPlus_DeveloperID.plist"
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  deploy_pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5.0.0
